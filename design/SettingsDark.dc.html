<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Settings, dark</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="width: 1280px; height: 1440px;">
  <dc-import name="Main" screen="settings" theme="dark" platform="windows" height="{{h}}" hint-size="1280px,1440px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":1440}}'>
class Component extends DCLogic { renderVals() { return { h: 1440 }; } }
</script>
</body>
</html>
