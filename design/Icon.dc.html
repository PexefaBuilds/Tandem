<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tandem app icon</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="width:1440px;height:900px;overflow:hidden;background:#f6f7f8;color:#131416;font-family:'Instrument Sans',system-ui,sans-serif;box-sizing:border-box;padding:48px 144px;display:flex;flex-direction:column;gap:24px">

  <header style="display:flex;flex-direction:column;gap:4px">
    <h1 style="margin:0;font-size:24px;line-height:30px;font-weight:600">Tandem app icon</h1>
    <p style="margin:0;font-size:14px;line-height:20px;color:#5b5e62">Two accounts side by side, offset like two people taking turns. Claude in clay, Codex in blue.</p>
  </header>

  <div style="display:flex;flex-direction:column;gap:48px">

    <section aria-label="macOS icons" style="display:flex;align-items:flex-end;gap:48px">
      <figure style="margin:0;display:flex;flex-direction:column;gap:8px">
        <svg role="img" aria-label="Tandem icon, macOS default appearance" width="320" height="320" viewBox="0 0 100 100" style="display:block">
          <rect x="0.15" y="0.15" width="99.7" height="99.7" rx="22.4" fill="#ffffff" stroke="#e6e8ea" stroke-width="0.3125"></rect>
          <g transform="translate(12.8 12.8) scale(1.55)">
            <rect x="7" y="4" width="15" height="32" rx="7.5" fill="#b4532c"></rect>
            <rect x="26" y="12" width="15" height="32" rx="7.5" fill="#2160c4"></rect>
          </g>
        </svg>
        <figcaption style="font-size:13px;line-height:16px;color:#5b5e62">macOS · Default</figcaption>
      </figure>

      <figure style="margin:0;display:flex;flex-direction:column;gap:8px">
        <svg role="img" aria-label="Tandem icon, macOS dark appearance" width="200" height="200" viewBox="0 0 100 100" style="display:block">
          <rect x="0" y="0" width="100" height="100" rx="22.4" fill="#1d1f21"></rect>
          <g transform="translate(12.8 12.8) scale(1.55)">
            <rect x="7" y="4" width="15" height="32" rx="7.5" fill="#e38c64"></rect>
            <rect x="26" y="12" width="15" height="32" rx="7.5" fill="#76a5f2"></rect>
          </g>
        </svg>
        <figcaption style="font-size:13px;line-height:16px;color:#5b5e62">macOS · Dark</figcaption>
      </figure>

      <figure style="margin:0;display:flex;flex-direction:column;gap:8px">
        <svg role="img" aria-label="Tandem icon, macOS tinted appearance" width="200" height="200" viewBox="0 0 100 100" style="display:block">
          <rect x="0" y="0" width="100" height="100" rx="22.4" fill="#232528"></rect>
          <g transform="translate(12.8 12.8) scale(1.55)">
            <rect x="7" y="4" width="15" height="32" rx="7.5" fill="#ececee"></rect>
            <rect x="26" y="12" width="15" height="32" rx="7.5" fill="#ececee" fill-opacity="0.55"></rect>
          </g>
        </svg>
        <figcaption style="font-size:13px;line-height:16px;color:#5b5e62">macOS · Tinted</figcaption>
      </figure>
    </section>

    <div style="display:flex;align-items:stretch;gap:48px">

      <section aria-label="Windows icons" style="background:#ffffff;border:1px solid #e6e8ea;border-radius:12px;padding:24px;display:flex;align-items:flex-end;gap:40px">
        <figure style="margin:0;display:flex;flex-direction:column;align-items:flex-start;gap:8px">
          <svg role="img" aria-label="Tandem icon, Windows 256 pixels" width="256" height="256" viewBox="0 0 48 48" style="display:block">
            <rect x="7" y="4" width="15" height="32" rx="7.5" fill="#b4532c"></rect>
            <rect x="26" y="12" width="15" height="32" rx="7.5" fill="#2160c4"></rect>
          </svg>
          <figcaption style="font-size:13px;line-height:16px;color:#5b5e62;white-space:nowrap">256 · Start menu</figcaption>
        </figure>
        <figure style="margin:0;display:flex;flex-direction:column;align-items:flex-start;gap:8px">
          <svg role="img" aria-label="Tandem icon, Windows 48 pixels" width="48" height="48" viewBox="0 0 48 48" style="display:block">
            <rect x="7" y="4" width="15" height="32" rx="7.5" fill="#b4532c"></rect>
            <rect x="26" y="12" width="15" height="32" rx="7.5" fill="#2160c4"></rect>
          </svg>
          <figcaption style="font-size:13px;line-height:16px;color:#5b5e62;white-space:nowrap">48</figcaption>
        </figure>
        <figure style="margin:0;display:flex;flex-direction:column;align-items:flex-start;gap:8px">
          <svg role="img" aria-label="Tandem icon, Windows 32 pixels" width="32" height="32" viewBox="0 0 48 48" style="display:block">
            <rect x="7" y="4" width="15" height="32" rx="7.5" fill="#b4532c"></rect>
            <rect x="26" y="12" width="15" height="32" rx="7.5" fill="#2160c4"></rect>
          </svg>
          <figcaption style="font-size:13px;line-height:16px;color:#5b5e62;white-space:nowrap">32 · taskbar</figcaption>
        </figure>
        <figure style="margin:0;display:flex;flex-direction:column;align-items:flex-start;gap:8px">
          <svg role="img" aria-label="Tandem icon, Windows 24 pixels, simplified" width="24" height="24" viewBox="5 2 38 44" style="display:block">
            <rect x="7" y="4" width="15" height="32" rx="7.5" fill="#b4532c"></rect>
            <rect x="26" y="12" width="15" height="32" rx="7.5" fill="#2160c4"></rect>
          </svg>
          <figcaption style="font-size:13px;line-height:16px;color:#5b5e62;white-space:nowrap">24 · simplified</figcaption>
        </figure>
        <figure style="margin:0;display:flex;flex-direction:column;align-items:flex-start;gap:8px">
          <svg role="img" aria-label="Tandem icon, Windows 16 pixels, simplified" width="16" height="16" viewBox="5 2 38 44" style="display:block">
            <rect x="7" y="4" width="15" height="32" rx="7.5" fill="#b4532c"></rect>
            <rect x="26" y="12" width="15" height="32" rx="7.5" fill="#2160c4"></rect>
          </svg>
          <figcaption style="font-size:13px;line-height:16px;color:#5b5e62;white-space:nowrap">16 · title bar, simplified</figcaption>
        </figure>
      </section>

      <section aria-label="Tray and menu bar glyphs" style="flex:1;display:flex;flex-direction:column;justify-content:flex-end;gap:24px">
        <figure style="margin:0;display:flex;flex-direction:column;gap:8px">
          <div style="height:40px;border-radius:8px;background:#f3f4f6;border:1px solid #e6e8ea;display:flex;align-items:center;justify-content:flex-end;gap:16px;padding:0 16px">
            <svg role="img" aria-label="Tandem tray glyph, 20 pixels, light" width="20" height="20" viewBox="5 2 38 44" style="display:block">
              <rect x="8" y="5" width="13" height="30" rx="6.5" fill="none" stroke="#131416" stroke-width="1.5" vector-effect="non-scaling-stroke"></rect>
              <rect x="27" y="13" width="13" height="30" rx="6.5" fill="none" stroke="#131416" stroke-width="1.5" vector-effect="non-scaling-stroke"></rect>
            </svg>
            <svg role="img" aria-label="Tandem tray glyph, 16 pixels, light" width="16" height="16" viewBox="5 2 38 44" style="display:block">
              <rect x="8" y="5" width="13" height="30" rx="6.5" fill="none" stroke="#131416" stroke-width="1.5" vector-effect="non-scaling-stroke"></rect>
              <rect x="27" y="13" width="13" height="30" rx="6.5" fill="none" stroke="#131416" stroke-width="1.5" vector-effect="non-scaling-stroke"></rect>
            </svg>
          </div>
          <figcaption style="font-size:13px;line-height:16px;color:#5b5e62">Tray · light · 20 and 16</figcaption>
        </figure>
        <figure style="margin:0;display:flex;flex-direction:column;gap:8px">
          <div style="height:40px;border-radius:8px;background:#1d1f21;display:flex;align-items:center;justify-content:flex-end;gap:16px;padding:0 16px">
            <svg role="img" aria-label="Tandem menu bar glyph, 20 pixels, dark" width="20" height="20" viewBox="5 2 38 44" style="display:block">
              <rect x="8" y="5" width="13" height="30" rx="6.5" fill="none" stroke="#ffffff" stroke-width="1.5" vector-effect="non-scaling-stroke"></rect>
              <rect x="27" y="13" width="13" height="30" rx="6.5" fill="none" stroke="#ffffff" stroke-width="1.5" vector-effect="non-scaling-stroke"></rect>
            </svg>
            <svg role="img" aria-label="Tandem menu bar glyph, 16 pixels, dark" width="16" height="16" viewBox="5 2 38 44" style="display:block">
              <rect x="8" y="5" width="13" height="30" rx="6.5" fill="none" stroke="#ffffff" stroke-width="1.5" vector-effect="non-scaling-stroke"></rect>
              <rect x="27" y="13" width="13" height="30" rx="6.5" fill="none" stroke="#ffffff" stroke-width="1.5" vector-effect="non-scaling-stroke"></rect>
            </svg>
          </div>
          <figcaption style="font-size:13px;line-height:16px;color:#5b5e62">Menu bar · dark · 20 and 16</figcaption>
        </figure>
      </section>

    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>class Component extends DCLogic { renderVals(){ return {}; } }</script>
</body>
</html>
