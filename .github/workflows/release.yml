name: Release
# Push a tag like v1.0.0 to build the Windows installers into a draft GitHub release.
# The macOS .dmg is built on the maintainer's Mac (GitHub's macOS runners queue for too long) and attached by hand.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - run: pnpm install --frozen-lockfile
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Tandem ${{ github.ref_name }}
          releaseBody: See CHANGELOG.md for what changed. Unsigned builds show a SmartScreen or Gatekeeper warning.
          releaseDraft: true
          args: ${{ matrix.args }}
